# networking

[patch.crates-io]
# Vendored alloy-evm: adds the `DisableBlockRewards` spec opt-out so signer-sealed chains
# (SmartNet/WEM) pay no block reward, matching geth exactly (empty blocks leave state
# unchanged). See vendor/alloy-evm and doc/istanbul-london-header-rlp.md.
alloy-evm = { path = "vendor/alloy-evm" }
# Vendored jsonrpsee client crates: drop the hard-coded C-based rustls `ring` provider
# features (and the corresponding `install_default` calls) so TLS runs on the pure-Rust
# CryptoProvider installed by the application. See vendor/jsonrpsee-*.
jsonrpsee-client-transport = { path = "vendor/jsonrpsee-client-transport" }
jsonrpsee-http-client = { path = "vendor/jsonrpsee-http-client" }
# Vendored proc-macro-error2 2.0.1: upstream re-exports a private `extern crate proc_macro`
# (E0365), so every build printed "packages contain code that will be rejected by a future
# version of Rust". One-line fix (make the extern crate public); pulled in by
# alloy-sol-macro/aquamarine, both pinned to versions requiring `<=2.0.1`.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
# Vendored proptest-arbitrary-interop 0.1.0: upstream makes a single generation attempt
# per test case over one fixed-size random buffer and treats buffer exhaustion as a hard
# failure ("initial arbitrary call failed"), so any `arb::<T>()` proptest with nested
# collections was flaky (~10%). Retry with fresh buffers before failing.
proptest-arbitrary-interop = { path = "vendor/proptest-arbitrary-interop" }
