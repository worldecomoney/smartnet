[workspace.package]
version = "3.7.2"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = ""
exclude = [".github/"]

[workspace]
members = [
    "bin/smartnet/",
    "crates/chain-state/",
    "crates/chainspec/",
    "crates/config/",
    "crates/consensus/consensus/",
    "crates/crypto/tls-provider/",
    "crates/primitives/traits/",
    "crates/storage/codecs/",
    "crates/storage/codecs/derive/",
    "testing/test-util/",
    "crates/engine/primitives/",
    "crates/engine/execution-cache/",
    "crates/engine/rpc-sync/",
    "crates/engine/tree/",
    "crates/errors/",
    "crates/ethereum/hardforks/",
    "crates/node/cli/",
    "crates/consensus/ethereum/",
    "crates/evm/ethereum",
    "crates/node/ethereum",
    "crates/payload/ethereum/",
    "crates/node/validator/",
    "crates/primitives/ethereum/",
    "crates/evm/evm",
    "crates/evm/execution-errors",
    "crates/evm/execution-types",
    "crates/metrics/",
    "crates/net/eth-wire-types",
    "crates/net/mesh/",
    "crates/net/network-api/",
    "crates/net/network-types/",
    "crates/net/rpc-sync/",
    "crates/node/api/",
    "crates/node/builder/",
    "crates/node/core/",
    "crates/node/types",
    "crates/payload/basic/",
    "crates/payload/builder/",
    "crates/payload/primitives/",
    "crates/storage/prune",
    "crates/storage/prune-types",
    "crates/evm/revm/",
    "crates/rpc/rpc-api/",
    "crates/rpc/rpc-builder/",
    "crates/rpc/rpc-engine-api/",
    "crates/rpc/rpc-eth-api/",
    "crates/rpc/rpc-eth-types/",
    "crates/rpc/rpc-server-types/",
    "crates/rpc/rpc-convert/",
    "crates/rpc/rpc/",
    "crates/stages/api/",
    "crates/stages/stages/",
    "crates/stages/types/",
    "crates/storage/db-api/",
    "crates/storage/db-models/",
    "crates/storage/db/",
    "crates/storage/errors/",
    "crates/storage/file-tier/",
    "crates/storage/provider/",
    "crates/storage/storage-api/",
    "crates/tasks/",
    "crates/timing/",
    "crates/tracing/",
    "crates/txpool/",
