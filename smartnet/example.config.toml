# SmartNet node operator config.
# Canonical runtime location: ~/.smartnet/config.toml
# Override with: smartnet --config /path/to/config.toml
#
# Required keys (a missing/empty/unparseable value aborts startup with an error that lists
# all problems at once and names the key): HOME_DIR_PATH, DATADIR_PATH, CROSS_BLOCK_CACHE_SIZE,
# MESH_PORT, MESH_ADDR, GPO_DEFAULT_SUGGESTED_FEE — plus HTTP_PORT and HTTP_ADDR for a plain
# node only (SEAL/BRIDGE roles are mesh-only and do not run RPC) — plus the validator-section
# keys listed below when SEAL = true.
# HOME_DIR_PATH is the ONLY absolute path in this file. Its leading `~/` is substituted once
# against $HOME. DATADIR_PATH, KEY_PATH, PASSWORD_FILE, MESH_PEERS_FILE and VAL_FILE are all
# relative to it: runtime path = HOME_DIR_PATH + <key value>.
# Config-owned *.json(l) files (VAL_FILE, MESH_PEERS_FILE) may be omitted: the scaffold then
# looks in the launch directory first, then HOME_DIR_PATH/, and errors if neither holds the
# file. They are never arguments to `smartnet`.
# Everything else is optional and carries its documented default. This file ships complete
# values for the current chain, so it boots as-is once the keystore exists: run
# `smartnet --config /path/to/config.toml keystore [RAW_PRIVATE_KEY_FILE]` before the first boot
# (it writes the encrypted keystore into `KEY_PATH` under a `UTC--…--<address>` name and deletes
# the raw source; this config file is NEVER edited). Boot uses exactly one encrypted file: either
# the single gathered file, or the one `COINBASE` selects among several. Every node role loads its
# mesh identity from that same keystore. Review every value for your deployment.
# The MESH_* keys are REQUIRED — the mesh is always on, so MESH_PORT (>= 1024) and
# MESH_ADDR must be set and a bind failure aborts the boot. The RPC is the optional half
# of the pair: it can be off while the mesh stays up. NODE_HEARTBEAT below drives every
# seal beats (production: keep it in the hundreds of ms — the mesh never waits on it).
# DB_ENGINE is optional (absent = fjall); VERB is optional (absent = 1 = info).
#
# Nothing operator-specific lives in the Rust code: if it is a value, it is a key here.

# The single runtime root. `~/` is expanded once against $HOME; all other path keys below are
# relative to this directory (no other `~`, no absolute values, no CWD resolution).
HOME_DIR_PATH = "~/.smartnet/"

# Optional log verbosity rank (VERB, 0-3): 0=errors only, 1=info, 2=debug, 3=trace.
# Emits the given level and everything more severe. Optional — leave blank for the default
VERB = 1

# --- node identity (all roles) ------------------------------------------------
# Optional NODE-LEVEL keystore selector — a helper only, not an identity, fee receiver, or
# consensus input. Set it when KEY_PATH holds several encrypted keys: boot picks the one whose
# UTC filename ends in this address and ignores the others. Any node may set it.
# Valid states are exactly two: (1) COINBASE set and exactly one matching file exists among any
# number of others; (2) COINBASE absent and KEY_PATH holds exactly one file. Everything else is
# a fatal error. When COINBASE is absent, the address is derived from the decrypted private key
# for internal use — it is never written back to this config.
# COINBASE = "0x<address-of-one-encrypted-key>"

# --- storage ----------------------------------------------------------------
# Chain data directory, relative to HOME_DIR_PATH (here: ~/.smartnet/data). Absolute values
# and `~` are rejected — HOME_DIR_PATH owns both.
DATADIR_PATH = "data"

# Storage engine selector — the only engine knob, validated at startup.
# Optional key — absent = "fjall", and fjall is the ONLY engine: the historical
# `sqlite`/`redb` names are rejected with a dedicated error (the shipped binary
# compiles no other backend). The config dictates the engine at every start: all
# chain data lives at `DATADIR_PATH/DB_ENGINE` (the engine directory is a child of
# whatever DATADIR_PATH names), so switching this key on a restart starts the node
# on the new engine's independent tree (fresh, if it has not been initialised yet) and
# never touches the other engine's files. The SMARTNET_DB_BACKEND environment variable
# overrides this key where it is honoured (test tiers).
# DB_ENGINE = "fjall"

# --- engine -----------------------------------------------------------------
# REQUIRED — cross-block execution cache size in MB. The allocation is pre-built by a
# background thread at startup, so the first block after boot never waits on it; 0 is
# rejected (there is no built-in default).
CROSS_BLOCK_CACHE_SIZE = 128

# REMOVED keys (now rejected at parse): RPC_SYNC, SYNC_PEERS, SYNC_BATCH and
# SYNC_POLL_INTERVAL — node-to-node sync is MESH-ONLY. There is no catch-up loop to
# switch on: the mesh carries blocks, `smartnet import` carries a whole chain.

# --- RPC --------------------------------------------------------------------
# PLAIN NODE ONLY. A plain node starts RPC from HTTP_PORT/HTTP_ADDR (or RPC_SERVER when set).
# Mesh-only roles (SEAL now, BRIDGE later) never start RPC: these keys are optional there and
# RPC_SERVER is forced off, so a validator config needs no HTTP bind address at all.

# Bind addresses and ports — no silent fallback to 127.0.0.1 / 0.0.0.0 / 8545.
# RPC on/off switch (true|false). Absent = HTTP_PORT/HTTP_ADDR enable RPC; present = explicit.
# !!! Stays in here for now, but can be replaced later with RPC_ADDR and RPC_PORT !!!
#RPC_SERVER = true
#HTTP_PORT = 8545
#HTTP_ADDR = "127.0.0.1"


#RPC_MEMPOOL = false

# Expose `web3_nodeInfo` (the closed mesh roster) on the public RPC. Optional — off keeps the
# method disabled. The node's own public key is not reported yet (mesh identity is by listen
# port until the keypair lands).
#RPC_NODEINFO = false

# Mempool entry floor in wei (`MIN_TO_TXPOOL_ENTRY`, optional): a tx-ENTRY check only —
# never a spendability or balance rule. Absent = 0.02 ether (20000000000000000 wei).
#MIN_TO_TXPOOL_ENTRY = 20000000000000000

# --- gas price oracle -------------------------------------------------------
# Must be >= SMARTNET_FIXED_GAS_PRICE_WEI (238095238095); 0 is rejected.
GPO_DEFAULT_SUGGESTED_FEE = 238095238095

# --- MESH --------------------------------------------------------------------
# The mesh is always on: MESH_PORT and MESH_ADDR are required, and a bind failure aborts
# the boot. The RPC is the optional half of the pair (it can be off while the mesh runs).

# Mesh gossip listener port — the closed-list binary WebSocket mesh that replaces devp2p.
# Required, and must be >= 1024. It must differ from HTTP_PORT and must equal this node's
# `port_range` in every peer's mainnet.jsonl — mesh self-identity is the listen port, so
# every node needs its own distinct port. Mesh band is 41700-41999 (several nodes per box
# = several ports, e.g. 41777/41811/41888).
MESH_PORT = 41700

# Mesh listen address — where the MESH_PORT listener binds. Required. "0.0.0.0" = all
# interfaces; set a specific interface address to restrict the listener. This is bind-only:
# peer entries still carry the address other nodes dial (127.0.0.1 for a single host).
MESH_ADDR = "0.0.0.0"

# Mesh peer file — one JSON object per line, re-read on every spread (membership changes
# need no restart). Relative to HOME_DIR_PATH (here: ~/.smartnet/mainnet.jsonl). When absent
# or blank, the scaffold looks for ./mainnet.jsonl then HOME_DIR_PATH/mainnet.jsonl; neither
# holding the file is a startup error. Absolute values and `~` are rejected.
# `address` is the peer's 0x Ethereum identity (legacy `key_id` is still accepted).
# Sample:
#   {"address":"0x24..31","url":"","ip":"127.0.0.1","port_range":41811,"active":true,"valid":true}
MESH_PEERS_FILE = "mainnet.jsonl"

# Max size of a single mesh WebSocket frame, in megabytes — covers the largest rumor the
# transport will move in one message (a full block RLP or a large tx batch). Optional: unset
# = 32 MB. 0 is rejected. It is a per-frame cap, not a total memory budget: the mesh holds
# at most a bounded number of in-flight frames per connection (see the concurrency limits in
# the code), so keep this in the tens of MB unless a single block truly needs more.
#MESH_MAX_MSG_MB = 32

# THE node heartbeat — the ONE trigger hook: 1 HB to bind them all. Every service
# attaches to it (validator seal beat when SEAL = true, bridge when BRIDGE = true, node
# duties); there is no second HB and no per-service cadence key. Units are MILLISECONDS:
# 500 is advised for a node and a validator alike (ships here at 500); a bridge may run
# 2000; everything is adjustable. 0 is rejected. The mesh keepalive is separate — a
# hardcoded liveness constant that only aims to keep the link alive.
NODE_HEARTBEAT = 500

# REMOVED keys (now rejected at parse): MESH_HEARTBEAT_MS, VALIDATOR_HEARTBEAT_MS and
# MESH_HEARTBEAT are gone — NODE_HEARTBEAT above is the single cadence key: the validator
# reads that same value. The mesh keepalive is its own HARDCODED liveness constant — it is
# not connected to `NODE_HEARTBEAT`; it only exists to keep the link alive.

# --- VALIDATOR -------------------------------------------------------

# The one validator registry file. Read at bootstrap into RAM; the node's block gate and
# the chair both use it. Relative to HOME_DIR_PATH (here: ~/.smartnet/validators.jsonl).
# When absent or blank, the scaffold looks for ./validators.jsonl then
# HOME_DIR_PATH/validators.jsonl; neither means an error. It is never a CLI argument.
VAL_FILE = "validators.jsonl"

# Mesh-only role: with SEAL = true the RPC listener is off and the HTTP_* keys are optional.
SEAL = true

ALLOW_EMPTY = false

# Total txs one seal pass processes: the pool snapshot is truncated to the oldest N
# pending txs (pool arrival, FIFO) before the state prefetch and the selection read it.
# Optional — absent/blank keeps 512, 0 is rejected. Per-class narrowing (native / heavy /
# …) comes later; the per-class caps below already bound what enters a block.
TXPOOL_VAL_MAX_TXS = 512

# Per-class caps: what each class may contribute to one sealed block (native transfer /
# ERC-20 transfer / contract create / NFT). Absent or blank = the defaults below; 0 is
# rejected (a zero cap would silently select nothing for that class). For load tests,
# raise MAX_NATIVE_PER_BLOCK together with TXPOOL_VAL_MAX_TXS — the snapshot truncation
# binds first, so raising only the per-class cap still seals at the snapshot size.
MAX_NATIVE_PER_BLOCK = 64
MAX_ERC_20_PER_BLOCK = 32
MAX_CONTRACTS_PER_BLOCK = 1
MAX_NFT_PER_BLOCK = 2

# Directory holding the encrypted keystore, relative to HOME_DIR_PATH (here:
# ~/.smartnet/keystore). Absolute values and `~` are rejected here — only HOME_DIR_PATH
# may be absolute or start with `~/`.
KEY_PATH = "keystore"

# The keystore lives in `KEY_PATH` under a `UTC--…--<address>` filename — no literal key path is
# configured. The node-level `COINBASE` above selects one among several; without it there must be
# exactly one file. This file is never edited to record a filename.
# Create it before the first boot (the raw-key file is optional; without it a key is generated):
#   smartnet --config /path/to/config.toml keystore [RAW_PRIVATE_KEY_FILE]
# File read for the keystore password, relative to HOME_DIR_PATH (here: ~/.smartnet/pw.txt).
# `""` means "prompt on the terminal" (no built-in path exists in the code). The headless
# mesh-identity load requires a password file — an interactive prompt is unavailable at boot.
PASSWORD_FILE = "password.txt"

# --- txpool tx lifetimes (TTL-POOL.md) --------------------------------------
# QUEUED (future-nonce) txs expire after this many seconds: the pool maintenance sweep
# evicts external queued txs past their TTL. Default 28800 s = 8 h (operator band 4-16 H).
# Entry/maintenance policy only — never consensus.
TXPOOL_QUEUED_TTL_SECS = 28800

# PENDING (executable) tx cap in seconds: 0 = no cap (a pending tx stays until included,
# replaced, invalidated, or evicted under pool pressure). Set >0 (6-24 H band) to sweep
# external pending txs older than the cap.
TXPOOL_PENDING_TTL_SECS = 0

# --- RPC batch policy limits -------------------------------------------------
# Per-batch class budgets of the batch-policy middleware (better-than-deny: admitted
# entries run, over-budget entries are answered per-id with -32005 and never touch the
# pool or the state).
#   RPC_BATCH_TX_MAX         - tx-class (sendRawTransaction/sendTransaction/…) budget;
#                              default 128.
#   RPC_BATCH_HEAVY_TX_MAX   - the tx budget shrinks to this when the batch carries a heavy
#                              request (debug_*/trace_* /eth_call/estimateGas/getProof/
#                              simulateV1/createAccessList); default 16.
#   RPC_BATCH_HEAVY_MAX      - heavy-class entries per batch; default 1.
#   RPC_BATCH_READ_MAX       - plain-lookup (read-class) budget per batch; default 1024.
RPC_BATCH_TX_MAX = 128
RPC_BATCH_HEAVY_TX_MAX = 16
RPC_BATCH_HEAVY_MAX = 1
RPC_BATCH_READ_MAX = 1024

# --- seed-tx (`smartnet seed-tx`) --------------------------------------------
# Recipient of the seed transfer. Zero address is rejected.
#SEED_TX_TO = "0x<recipient-address>"
# Amount in wei. 0 is rejected. Guidance for a test transfer: 1000000000000000 (0.001 ETH).
#SEED_TX_VALUE_WEI = 1000000000000000
# Gas limit of the seed transfer. 0 is rejected. A plain transfer needs 21000.
#SEED_TX_GAS_LIMIT = 21000

