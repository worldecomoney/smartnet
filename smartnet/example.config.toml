# SmartNet node operator config.
# Canonical runtime location: ~/.smartnet/node/config.toml
# Override with: smartnet --config /path/to/config.toml
#
# Every key needed to boot is REQUIRED. This file ships with working values for the current
# chain, so it starts as-is. The Rust code has NO built-in defaults: every value comes from
# this file, and a missing key, an empty value, an unparseable value, or a failed sanity
# check aborts startup with an error that lists all problems at once and names the key.
# Review every value below for your deployment before running.
# The MESH_* keys are REQUIRED — the mesh is always on, so MESH_PORT (>= 1024) and
# MESH_ADDR must be set and a bind failure aborts the boot. The RPC is the optional half
# of the pair: it can be off while the mesh stays up. HEARTBEAT_MS below drives validator
# seal beats (production: keep it in the hundreds of ms — the mesh never waits on it).
# DB_ENGINE is also optional
# (absent = fjall); VERBOSITY is optional and ships commented.
#
# Nothing operator-specific lives in the Rust code: if it is a value, it is a key here.

# Optional log verbosity rank (0-4): 0=off, 1=info, 2=debug, 3=warning, 4=errors.
# Emits the given level and everything more severe. Optional — leave blank for the default
VERB = 1

# --- storage ----------------------------------------------------------------
# Absolute path to the chain data and runtime files. No default, no current-working-
# directory resolution. `~` (and `~/…`) expand to $HOME when HOME is set; otherwise an
# absolute path is required. Example uses the conventional ~/.smartnet location.
# !!! Satys in here !!!
DATADIR_PATH = "~/.smartnet/data"

# Storage engine selector — the only engine knob, validated at startup:
#   DB_ENGINE = "sqlite"   // engines: "sqlite", "redb", "fjall" (default)
# Optional key — absent = "fjall". All engines are compiled into the shipped binary —
# this key only selects at runtime. The config dictates the engine at every start: all
# chain data lives at `DATADIR_PATH/DB_ENGINE` (the engine directory is a child of
# whatever DATADIR_PATH names), so switching this key on a restart starts the node
# on the new engine's independent tree (fresh, if it has not been initialised yet) and
# never touches the other engine's files. The SMARTNET_DB_BACKEND environment variable
# overrides this key where it is honoured (test tiers).
# REMOVAL candidate !!!
# DB_ENGINE = "fjall"

# --- engine -----------------------------------------------------------------
# REQUIRED — cross-block execution cache size in MB. The allocation is pre-built by a
# background thread at startup, so the first block after boot never waits on it; 0 is
# rejected (there is no built-in default).
# !!! Satys in here MB !!!
CROSS_BLOCK_CACHE_SIZE = 128

# OPTIONAL — master switch for the in-node RPC catch-up service (true/false), default
# false. The service starts only when RPC_SYNC = true AND SYNC_PEERS is non-empty AND
# SYNC_BATCH >= 1 AND SYNC_POLL_INTERVAL > 0; otherwise the catch-up loop is never
# started. Everything else — mesh gossip, `smartnet import` (RLP), and all RPC
# functionality — behaves identically either way (the sync code lives in its own crate
# and runs as its own task).
# !!! TMP, stays until mesh is fully functional, then removed, mesh uses it's own list of peers to sync
RPC_SYNC = false

# REQUIRED — JSON-RPC endpoints this node syncs from (temporary transport: RPC allow-list
# sync, not a permanent design; there is no p2p sync yet). No built-in peer list exists.
# `[]` means "sync from nobody": the node will not fetch anything and will only advance
# from blocks submitted by validators via engine_newPayload. Only consulted when
# RPC_SYNC = true.
# !!! TMP, stays until mesh is fully functional, then removed, mesh uses it's own list of peers to sync
SYNC_PEERS = [
"https://rpc2.wemblockchain.com"
]

# REQUIRED — blocks fetched per batch round trip. `SYNC_BATCH = 0` means "no sync": the
# catch-up service is not started at all, no peer is contacted, and the node only advances
# from blocks validators submit via engine_newPayload. Must be >= 1 to sync.
# !!! TMP, stays until mesh is fully functional, then removed, mesh uses it's own list of peers to sync
SYNC_BATCH = 0

# REQUIRED — seconds between catch-up passes. Only used when SYNC_BATCH >= 1; 0 is rejected
# in that case (it would busy-loop). With SYNC_BATCH = 0 it is unused, so 0 is accepted here.
# !!! TMP, stays until mesh is fully functional, then removed, mesh uses it's own list of peers to sync
SYNC_POLL_INTERVAL = 3

# --- RPC --------------------------------------------------------------------

# Bind addresses and ports — no silent fallback to 127.0.0.1 / 0.0.0.0 / 8545
# !!! Satys in here !!! but can be replaced with RPC_ADDR and RPC_PORT
# RPC on/off switch (true|false). Absent = legacy behavior (HTTP_PORT/HTTP_ADDR enable RPC);
# present = explicit, overrides the implicit port-derived switch.
RPC_SERVER = true
HTTP_PORT = 8545
HTTP_ADDR = "127.0.0.1"


#RPC_MEMPOOL = false

# Expose `web3_nodeInfo` (the closed mesh roster) on the public RPC. Optional — off keeps the
# method disabled. The node's own public key is not reported yet (mesh identity is by listen
# port until the keypair lands).
#RPC_NODEINFO = false

# Mempool entry floor in wei (`MIN_TO_TXPOOL_ENTRY`, optional): a tx-ENTRY check only —
# never a spendability or balance rule. Absent = 0.02 ether (20000000000000000 wei).
#MIN_TO_TXPOOL_ENTRY = 20000000000000000

# --- gas price oracle -------------------------------------------------------
# Must be >= SMARTNET_FIXED_GAS_PRICE_WEI (238095238095); 0 is rejected.
GPO_DEFAULT_SUGGESTED_FEE = 238095238095

# --- MESH --------------------------------------------------------------------
# The mesh is always on: MESH_PORT and MESH_ADDR are required, and a bind failure aborts
# the boot. The RPC is the optional half of the pair (it can be off while the mesh runs).

# Mesh gossip listener port — the closed-list binary WebSocket mesh that replaces devp2p.
# Required, and must be >= 1024. It must differ from HTTP_PORT and must equal this node's
# `port_range` in every peer's mainnet.jsonl — mesh self-identity is the listen port, so
# every node needs its own distinct port. Mesh band is 41700-41999 (several nodes per box
# = several ports, e.g. 41777/41811/41888).
# !!! Satys in here !!!
MESH_PORT = 41700

# Mesh listen address — where the MESH_PORT listener binds. Required. "0.0.0.0" = all
# interfaces; set a specific interface address to restrict the listener.
# !!! Satys in here !!!
MESH_ADDR = "0.0.0.0"

# Mesh peer file — one JSON object per line, re-read on every spread (membership changes
# need no restart). Missing file = outbound gossip off (logged once); the inbound listener
# still runs. `~` expands via HOME. Example entry / shipped sample: smartnet/example.mainnet.jsonl
#   {"key_id":"node-a","url":"","ip":"127.0.0.1","port_range":41811,"active":true,"valid":true}
MESH_PEERS_FILE = "~/.smartnet/mainnet.jsonl"

# Max size of a single mesh WebSocket frame, in megabytes — covers the largest rumor the
# transport will move in one message (a full block RLP or a large tx batch). Optional: unset
# = 32 MB. 0 is rejected. It is a per-frame cap, not a total memory budget: the mesh holds
# at most a bounded number of in-flight frames per connection (see the concurrency limits in
# the code), so keep this in the tens of MB unless a single block truly needs more.
# !!! Satys in here !!!
#MESH_MAX_MSG_MB = 32

# Mesh keepalive ping cadence, in ms: each idle link pings after ~half of this passes with
# no outbound traffic. The shared silence bound (both ends declare a silent peer dead and
# reconnect) derives as this + 300 ms, so a live connection always survives at least one
# full ping period before either side gives up — no accidental drops on a healthy link.
# Optional: unset = 500. 0 is rejected. Raise it on slow WAN links; keep it in the hundreds
# of ms for block gossip (~1 block/s now, up to 10 blocks/s later).
#MESH_HEARTBEAT = 500

# Validator heartbeat: on each beat the validator seals/checks its txpool first (only when
# SEAL = true). Mesh links keep themselves alive (PING/PONG + reconnect) — no sweep here.
# The mesh never waits on this value. Units are milliseconds, always: keep it in the low
# hundreds of ms in production (this ships at 2000 only as a comfortable debug cadence).
# Anything in the seconds/minutes range is too slow for production. 0 is rejected.
# !!! Satys in here !!!
HEARTBEAT_MS = 2000

# REMOVED keys (now rejected at parse): MESH_HEARTBEAT_MS and VALIDATOR_HEARTBEAT_MS are gone.
# The validator cadence is HEARTBEAT_MS above; the mesh keepalive is MESH_HEARTBEAT above.

# --- VALIDATOR -------------------------------------------------------

SEAL = true

ALLOW_EMPTY = false

# Total txs one seal pass processes: the pool snapshot is truncated to the oldest N
# pending txs (pool arrival, FIFO) before the state prefetch and the selection read it.
# Optional — absent/blank keeps 512, 0 is rejected. Per-class narrowing (native / heavy /
# …) comes later; the per-class caps below already bound what enters a block.
TXPOOL_VAL_MAX_TXS = 512

# Per-class caps: what each class may contribute to one sealed block (native transfer /
# ERC-20 transfer / contract create / NFT). Absent or blank = the defaults below; 0 is
# rejected (a zero cap would silently select nothing for that class). For load tests,
# raise MAX_NATIVE_PER_BLOCK together with TXPOOL_VAL_MAX_TXS — the snapshot truncation
# binds first, so raising only the per-class cap still seals at the snapshot size.
MAX_NATIVE_PER_BLOCK = 64
MAX_ERC_20_PER_BLOCK = 32
MAX_CONTRACTS_PER_BLOCK = 1
MAX_NFT_PER_BLOCK = 2

# Absolute path to the directory holding the encrypted keystore. Use a path under
# `~/.smartnet/`, e.g. ~/.smartnet/validator/secure
KEY_PATH = "~/.smartnet/keystore"

# Keystore filename under KEY_PATH. Written by `smartnet-validator keystore`; `""` means
# "not initialized yet" (explicitly allowed — the seal path refuses to start while empty
# and never generates a key for you).
KEY_FILE = "UTC--2026-10-17T09-54-17.158609342Z--55155936e45eaa889ec5acfd0e895622e803afcb"

# File read for the keystore password. `""` means "prompt on the terminal" (no built-in
# password path exists in the code). When set, use a path under `~/.smartnet/`,
# e.g. ~/.smartnet/validator/secure/password.txt (`~` expands to $HOME).
PASSWORD_FILE = "~/.smartnet/pw.txt"

# REQUIRED — the node RPC endpoint this validator seals against. No built-in endpoint
# exists: left empty, startup fails with a clear error.
#NODE_URL = "http://127.0.0.1:8545"

# Fee receiver for sealed blocks. Replace with your own address; zero address is rejected.
#COINBASE = "0x55155936e45eaa889ec5acfd0e895622e803afcb"

# --- txpool tx lifetimes (TTL-POOL.md) --------------------------------------
# QUEUED (future-nonce) txs expire after this many seconds: the pool maintenance sweep
# evicts external queued txs past their TTL. Default 28800 s = 8 h (operator band 4-16 H).
# Entry/maintenance policy only — never consensus.
TXPOOL_QUEUED_TTL_SECS = 28800

# PENDING (executable) tx cap in seconds: 0 = no cap (a pending tx stays until included,
# replaced, invalidated, or evicted under pool pressure). Set >0 (6-24 H band) to sweep
# external pending txs older than the cap.
TXPOOL_PENDING_TTL_SECS = 0

# --- RPC batch policy limits -------------------------------------------------
# Per-batch class budgets of the batch-policy middleware (better-than-deny: admitted
# entries run, over-budget entries are answered per-id with -32005 and never touch the
# pool or the state).
#   RPC_BATCH_TX_MAX         - tx-class (sendRawTransaction/sendTransaction/…) budget;
#                              default 128.
#   RPC_BATCH_HEAVY_TX_MAX   - the tx budget shrinks to this when the batch carries a heavy
#                              request (debug_*/trace_* /eth_call/estimateGas/getProof/
#                              simulateV1/createAccessList); default 16.
#   RPC_BATCH_HEAVY_MAX      - heavy-class entries per batch; default 1.
#   RPC_BATCH_READ_MAX       - plain-lookup (read-class) budget per batch; default 1024.
RPC_BATCH_TX_MAX = 128
RPC_BATCH_HEAVY_TX_MAX = 16
RPC_BATCH_HEAVY_MAX = 1
RPC_BATCH_READ_MAX = 1024

# Timeout applied to every JSON-RPC request this validator sends (milliseconds). 0 is
# rejected. Guidance for a healthy local node: 30000.
#RPC_TIMEOUT_MS = 30000

# --- seed-tx (`smartnet-validator seed-tx`) ----------------------------------
# Recipient of the seed transfer. Zero address is rejected.
#SEED_TX_TO = "0x55155936e45eaa889ec5acfd0e895622e803afcb"
# Amount in wei. 0 is rejected. Guidance for a test transfer: 1000000000000000 (0.001 ETH).
#SEED_TX_VALUE_WEI = 1000000000000000
# Gas limit of the seed transfer. 0 is rejected. A plain transfer needs 21000.
#SEED_TX_GAS_LIMIT = 21000

