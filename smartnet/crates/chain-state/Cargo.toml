[package]
name = "smartnet-chain-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chain state types and functionality."

[lints]
workspace = true

[dependencies]
# upstream-derived
smartnet-chainspec.workspace = true
smartnet-errors.workspace = true
smartnet-execution-types.workspace = true
smartnet-metrics.workspace = true
smartnet-ethereum-primitives.workspace = true
smartnet-primitives-traits.workspace = true
smartnet-storage-api.workspace = true
smartnet-trie.workspace = true

# ethereum
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["std"] }
alloy-consensus.workspace = true
revm-database.workspace = true
revm-state = { workspace = true, optional = true }

# async
tokio = { workspace = true, default-features = false, features = ["sync", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }

# tracing
tracing.workspace = true

# misc
derive_more.workspace = true
metrics.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }

# optional deps for test-utils
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
arbitrary.workspace = true
bincode.workspace = true
smartnet-ethereum-primitives = { workspace = true, features = ["arbitrary", "std"] }
smartnet-primitives-traits = { workspace = true, features = ["test-utils"] }
smartnet-testing-utils.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
rand.workspace = true
revm-state.workspace = true

[features]
serde = [
    "dep:serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "parking_lot/serde",
    "rand?/serde",
    "smartnet-ethereum-primitives/serde",
    "smartnet-execution-types/serde",
    "smartnet-primitives-traits/serde",
    "smartnet-trie/serde",
    "revm-database/serde",
    "revm-state?/serde",
    "smartnet-storage-api/serde",
]
test-utils = [
    "alloy-primitives/getrandom",
    "alloy-signer",
    "alloy-signer-local",
    "rand",
    "revm-state",
    "smartnet-chainspec/test-utils",
    "smartnet-primitives-traits/test-utils",
    "smartnet-trie/test-utils",
    "smartnet-ethereum-primitives/test-utils",
]
rayon = ["dep:rayon"]
serde-bincode-compat = [
    "smartnet-execution-types/serde-bincode-compat",
    "serde_with",
    "alloy-eips/serde-bincode-compat",
]
