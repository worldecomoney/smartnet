[package]
name = "smartnet-trie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Merkle trie implementation"

[lints]
workspace = true

[dependencies]
# upstream-derived
smartnet-primitives-traits = { workspace = true, features = ["std"] }
smartnet-stages-types.workspace = true
smartnet-storage-errors.workspace = true
smartnet-trie-sparse.workspace = true
smartnet-trie-common = { workspace = true, features = ["rayon"] }

revm-database.workspace = true

# alloy
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-trie.workspace = true

# tracing
tracing = { workspace = true, features = ["attributes"] }

# misc
auto_impl.workspace = true
itertools.workspace = true

# `metrics` feature
smartnet-metrics = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

# `test-utils` feature
triehash = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# upstream-derived
smartnet-primitives-traits = { workspace = true, features = ["test-utils"] }
smartnet-tracing.workspace = true
smartnet-trie-common = { workspace = true, features = ["test-utils", "arbitrary"] }

# revm

# trie
triehash.workspace = true

# misc
assert_matches.workspace = true
criterion.workspace = true
parking_lot.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
rand.workspace = true

[features]
metrics = ["smartnet-metrics", "dep:metrics"]
serde = [
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-eips/serde",
    "smartnet-trie-common/serde",
    "smartnet-primitives-traits/serde",
    "alloy-primitives/serde",
    "alloy-consensus/serde",
    "alloy-trie/serde",
    "alloy-eips/serde",
    "smartnet-trie-common/serde",
    "revm-database/serde",
    "smartnet-stages-types/serde",
    "parking_lot/serde",
    "rand/serde",
]
test-utils = [
    "triehash",
    "parking_lot",
    "smartnet-primitives-traits/test-utils",
    "smartnet-trie-common/test-utils",
    "smartnet-trie-sparse/test-utils",
    "smartnet-stages-types/test-utils",
]
serde-bincode-compat = [
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
    "smartnet-trie-common/serde-bincode-compat",
]

[[bench]]
name = "proof_v2"
required-features = ["test-utils"]
harness = false
