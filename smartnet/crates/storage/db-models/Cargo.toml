[package]
name = "smartnet-db-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Database models used in storage module."

[lints]
workspace = true

[dependencies]
# upstream-derived
smartnet-codecs = { workspace = true, optional = true }
smartnet-primitives-traits.workspace = true

# ethereum
alloy-primitives.workspace = true
alloy-eips.workspace = true

# codecs
modular-bitfield = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# misc
bytes = { workspace = true, optional = true }

# arbitrary utils
arbitrary = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
# upstream-derived
smartnet-primitives-traits = { workspace = true, features = ["arbitrary", "smartnet-codec"] }
smartnet-codecs.workspace = true

bytes.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true

[features]
default = ["std"]
std = [
    "alloy-eips/std",
    "alloy-primitives/std",
    "smartnet-primitives-traits/std",
    "bytes?/std",
    "serde?/std",
    "smartnet-codecs?/std",
]
serde = [
    "dep:serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "smartnet-codecs?/serde",
    "smartnet-primitives-traits/serde",
]
test-utils = [
    "smartnet-primitives-traits/test-utils",
    "arbitrary",
    "smartnet-codecs?/test-utils",
]
arbitrary = [
    "std",
    "smartnet-primitives-traits/arbitrary",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-eips/arbitrary",
    "smartnet-codecs?/arbitrary",
]
smartnet-codec = [
    "dep:smartnet-codecs",
    "dep:modular-bitfield",
    "dep:bytes",
    "smartnet-primitives-traits/smartnet-codec",
]
