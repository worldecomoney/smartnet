[package]
name = "smartnet-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SmartNet storage provider."

[lints]
workspace = true

[dependencies]
# upstream-derived
smartnet-chainspec.workspace = true
smartnet-execution-types.workspace = true
smartnet-ethereum-primitives = { workspace = true, features = ["smartnet-codec"] }
smartnet-primitives-traits = { workspace = true, features = ["smartnet-codec", "dashmap"] }
smartnet-errors.workspace = true
smartnet-storage-errors.workspace = true
smartnet-storage-api = { workspace = true, features = ["std", "db-api"] }
smartnet-db = { workspace = true }
smartnet-db-api.workspace = true
smartnet-prune-types.workspace = true
smartnet-stages-types.workspace = true
smartnet-tasks = { workspace = true, features = ["rayon"] }
smartnet-trie = { workspace = true, features = ["metrics"] }
smartnet-trie-db = { workspace = true, features = ["metrics"] }
smartnet-chain-state.workspace = true
smartnet-file-tier.workspace = true
smartnet-node-types.workspace = true
smartnet-codecs.workspace = true
smartnet-config.workspace = true
smartnet-fs-util.workspace = true
smartnet-timing.workspace = true

# ethereum
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-consensus.workspace = true
revm-database.workspace = true
revm-state = { workspace = true, optional = true }

# tracing
tracing.workspace = true

# metrics
smartnet-metrics.workspace = true
metrics.workspace = true

# misc
boyer-moore-magiclen.workspace = true
itertools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
strum.workspace = true
eyre.workspace = true

# test-utils
smartnet-engine-primitives = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }

# parallel utils
rayon.workspace = true

# temp file spill for the ETL collector
tempfile.workspace = true

[dev-dependencies]
smartnet-db = { workspace = true, features = ["test-utils"] }
smartnet-primitives-traits = { workspace = true, features = ["arbitrary", "test-utils"] }
smartnet-chain-state = { workspace = true, features = ["test-utils"] }
smartnet-trie = { workspace = true, features = ["test-utils"] }
smartnet-testing-utils.workspace = true
smartnet-engine-primitives.workspace = true
smartnet-ethereum-primitives.workspace = true

revm-database-interface.workspace = true
revm-state.workspace = true

assert_matches.workspace = true
rand.workspace = true

tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }

[features]
test-utils = [
    "smartnet-db/test-utils",
    "smartnet-trie/test-utils",
    "smartnet-chain-state/test-utils",
    "smartnet-engine-primitives",
    "smartnet-ethereum-primitives/test-utils",
    "smartnet-chainspec/test-utils",
    "smartnet-primitives-traits/test-utils",
    "smartnet-db-api/test-utils",
    "smartnet-trie-db/test-utils",
    "smartnet-prune-types/test-utils",
    "smartnet-stages-types/test-utils",
    "revm-state",
    "tokio",
    "smartnet-tasks/test-utils",
]
