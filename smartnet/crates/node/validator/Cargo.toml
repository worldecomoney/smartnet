[package]
name = "smartnet-validator"
version = "2.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "SmartNet block producer: config + encrypted keystore, seal via smartnet_newPayload (RLP) only."

[lib]
name = "smartnet_validator"
path = "src/lib.rs"

[dependencies]
alloy-consensus = { workspace = true, default-features = false, features = ["std", "serde", "k256"] }
alloy-eips = { workspace = true, default-features = false, features = ["std"] }
alloy-network = { workspace = true, default-features = false }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider = { workspace = true, default-features = false, features = ["reqwest"] }
alloy-rpc-client = { workspace = true, default-features = false, features = ["reqwest"] }
alloy-rlp = { workspace = true, default-features = false, features = ["core-net"] }
alloy-rpc-types-engine = { workspace = true, default-features = false, features = ["std", "serde"] }
alloy-rpc-types-eth = { workspace = true, default-features = false, features = ["serde"] }
alloy-rpc-types-txpool.workspace = true
alloy-signer-local = { workspace = true, default-features = false, features = ["keystore"] }
# Keystore decryption from bytes already loaded into RAM (no naked key resident).
aes = "0.8"
ctr = "0.9"
eth-keystore = "0.5"
hmac.workspace = true
pbkdf2 = "0.11"
scrypt = "0.10"
sha2.workspace = true
sha3 = "0.10"
zeroize = "1"
calibri-lite-consensus.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { workspace = true, features = ["derive"] }
eyre = "0.6"
rand_08.workspace = true
rpassword = "7.3"
# Pure-Rust TLS: rustls without a built-in (C) provider; installed in main().
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider", "stream"] }
k256 = { workspace = true, default-features = false, features = ["ecdsa"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
smartnet-chainspec.workspace = true
smartnet-fs-util.workspace = true
smartnet-payload-types.workspace = true
smartnet-db = { workspace = true, default-features = false }
smartnet-provider.workspace = true
smartnet-timing.workspace = true
smartnet-tls-provider.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true, default-features = false, features = ["attributes"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url = { workspace = true, default-features = false }

[lints]
workspace = true
