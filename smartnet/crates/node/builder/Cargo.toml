smartnet-node-ethereum.workspace = true
smartnet-provider = { workspace = true, features = ["test-utils"] }
smartnet-evm-ethereum = { workspace = true, features = ["test-utils"] }

[features]
default = []
test-utils = [
    "smartnet-db/test-utils",
    "smartnet-chain-state/test-utils",
    "smartnet-chainspec/test-utils",
    "smartnet-consensus/test-utils",
    "smartnet-engine-tree/test-utils",
    "smartnet-evm/test-utils",
    "smartnet-payload-builder/test-utils",
    "smartnet-stages/test-utils",
    "smartnet-db-api/test-utils",
    "smartnet-provider/test-utils",
    "smartnet-transaction-pool/test-utils",
    "smartnet-trie-db/test-utils",
    "smartnet-evm-ethereum/test-utils",
    "smartnet-node-ethereum/test-utils",
    "smartnet-primitives-traits/test-utils",
    "smartnet-tasks/test-utils",
