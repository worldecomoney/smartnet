[package]
name = "smartnet-node-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
## upstream-derived
smartnet-chain-state.workspace = true
smartnet-chainspec.workspace = true
smartnet-config = { workspace = true, features = ["serde"] }
smartnet-consensus.workspace = true
smartnet-db = { workspace = true }
smartnet-db-api.workspace = true
smartnet-engine-primitives = { workspace = true, features = ["std"] }
