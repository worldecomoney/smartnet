smartnet-fs-util.workspace = true
smartnet-eth-wire-types.workspace = true
smartnet-network-api.workspace = true
smartnet-node-api.workspace = true
smartnet-node-core.workspace = true
smartnet-payload-builder.workspace = true
smartnet-primitives-traits.workspace = true
smartnet-provider.workspace = true
smartnet-prune.workspace = true
smartnet-rpc.workspace = true
smartnet-rpc-api = { workspace = true, features = ["client"] }
smartnet-rpc-builder.workspace = true
smartnet-rpc-engine-api.workspace = true
smartnet-rpc-eth-types.workspace = true
smartnet-stages.workspace = true
calibri-lite-consensus.workspace = true
smartnet-errors.workspace = true
smartnet-prune-types.workspace = true
smartnet-payload-primitives.workspace = true
smartnet-revm = { workspace = true, features = ["serde"] }
smartnet-storage-api = { workspace = true, features = ["std"] }
smartnet-timing.workspace = true
smartnet-tasks = { workspace = true, features = ["rayon"] }
smartnet-tracing.workspace = true
smartnet-transaction-pool.workspace = true
smartnet-trie-db = { workspace = true, features = ["metrics"] }
smartnet-basic-payload-builder.workspace = true

## ethereum
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types = { workspace = true, features = ["engine"] }
alloy-eips.workspace = true
alloy-rpc-types-engine.workspace = true

serde.workspace = true
serde_json.workspace = true
derive_more.workspace = true
humantime.workspace = true
itertools.workspace = true
pin-project.workspace = true
## async
futures.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time", "rt-multi-thread"] }
tokio-stream.workspace = true
tokio-util.workspace = true

## crypto

## misc
aquamarine.workspace = true
eyre.workspace = true
parking_lot.workspace = true
jsonrpsee.workspace = true
fdlimit.workspace = true
rayon.workspace = true

# tracing
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
smartnet-ethereum-primitives.workspace = true
smartnet-revm = { workspace = true, features = ["test-utils"] }
