[package]
name = "smartnet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
smartnet-rpc-builder.workspace = true
# upstream-derived
calibri-lite-consensus.workspace = true
smartnet-chainspec.workspace = true
smartnet-config = { workspace = true, features = ["serde"] }
smartnet-validator.workspace = true
smartnet-db.workspace = true
smartnet-eth-wire-types.workspace = true
smartnet-evm.workspace = true
smartnet-file-tier.workspace = true
smartnet-fs-util.workspace = true
smartnet-network-api.workspace = true
smartnet-node-builder.workspace = true
smartnet-node-core.workspace = true
smartnet-primitives-traits.workspace = true
smartnet-provider.workspace = true
smartnet-node-ethereum.workspace = true
smartnet-rpc-server-types.workspace = true
smartnet-rpc-eth-api.workspace = true
smartnet-transaction-pool.workspace = true
smartnet-tasks.workspace = true
smartnet-tracing.workspace = true
smartnet-node-api.workspace = true

# async
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }

# misc
alloy-genesis.workspace = true
alloy-primitives.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# fs
tempfile.workspace = true
serde_json.workspace = true

[[example]]
name = "dump_canonical_genesis"
required-features = ["test-utils"]

[features]

min-error-logs = [
    "tracing/release_max_level_error",
    "smartnet-node-core/min-error-logs",
]
min-warn-logs = [
    "tracing/release_max_level_warn",
    "smartnet-node-core/min-warn-logs",
]
min-info-logs = [
    "tracing/release_max_level_info",
    "smartnet-node-core/min-info-logs",
]
min-debug-logs = [
    "tracing/release_max_level_debug",
    "smartnet-node-core/min-debug-logs",
]
min-trace-logs = [
    "tracing/release_max_level_trace",
    "smartnet-node-core/min-trace-logs",
]
# Test/dev-only chain data: enables the code-built canonical rulebook module and the
# `dump_canonical_genesis` example. The runtime builds its rulebook from the stored genesis
# exclusively — this feature never ships in a production binary.
test-utils = []
