[package]
name = "smartnet-stages-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pipeline stage types."

[lints]
workspace = true

[dependencies]
smartnet-codecs = { workspace = true, optional = true }
smartnet-trie-common.workspace = true
alloy-primitives.workspace = true

serde = { workspace = true, optional = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }

bytes = { workspace = true, optional = true }
modular-bitfield = { workspace = true, optional = true }

[dev-dependencies]
smartnet-codecs.workspace = true
smartnet-trie-common = { workspace = true, features = ["smartnet-codec"] }
alloy-primitives = { workspace = true, features = ["arbitrary", "rand"] }
arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
rand.workspace = true
bytes.workspace = true
modular-bitfield.workspace = true

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "bytes?/std",
    "smartnet-trie-common/std",
    "serde?/std",
    "smartnet-codecs?/std",
]
smartnet-codec = [
    "dep:smartnet-codecs",
    "dep:bytes",
    "dep:modular-bitfield",
    "smartnet-trie-common/smartnet-codec",
]
test-utils = [
    "arbitrary",
    "smartnet-codecs?/test-utils",
    "smartnet-trie-common/test-utils",
]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "smartnet-codecs?/arbitrary",
    "smartnet-trie-common/arbitrary",
]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "bytes?/serde",
    "rand/serde",
    "smartnet-codecs?/serde",
    "smartnet-trie-common/serde",
]
