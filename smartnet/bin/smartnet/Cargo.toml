[package]
name = "smartnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SmartNet execution node"
default-run = "smartnet"

[package.metadata.deb]
maintainer = "SmartNet"
depends = "$auto"
section = "network"
priority = "optional"
maintainer-scripts = "../../pkg/smartnet/debian/"
assets = [
    "$auto",
    ["../../README.md", "usr/share/doc/smartnet/", "644"],
    ["../../../LICENSE", "usr/share/doc/smartnet/", "644"],
]
systemd-units = { enable = false, start = false, unit-name = "smartnet", unit-scripts = "../../pkg/smartnet/debian" }

[lints]
workspace = true

[dependencies]
# SmartNet node (upstream-derived execution stack)
smartnet-cli.workspace = true
smartnet-chainspec.workspace = true
smartnet-primitives-traits.workspace = true
smartnet-ethereum-primitives.workspace = true
smartnet-db.workspace = true
smartnet-provider.workspace = true
smartnet-revm.workspace = true
smartnet-transaction-pool.workspace = true
smartnet-ethereum-consensus.workspace = true
smartnet-rpc-builder.workspace = true
smartnet-rpc.workspace = true
smartnet-rpc-convert.workspace = true
smartnet-rpc-api = { workspace = true, features = ["client"] }
smartnet-rpc-eth-types.workspace = true
smartnet-rpc-server-types.workspace = true
smartnet-network-api.workspace = true
smartnet-tasks.workspace = true
smartnet-payload-builder.workspace = true
smartnet-payload-primitives.workspace = true
smartnet-node-api.workspace = true
smartnet-node-core.workspace = true
smartnet-ethereum-payload-builder.workspace = true
smartnet-node-ethereum.workspace = true
smartnet-node-builder.workspace = true
smartnet-tls-provider.workspace = true
smartnet-consensus.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-rpc-types = { workspace = true, features = ["engine"] }

# tracing
tracing.workspace = true

# misc
aquamarine.workspace = true
clap = { workspace = true, features = ["derive", "env"] }

[dev-dependencies]

[features]
default = [
    "smartnet-revm/portable",
    "keccak-cache-global",
    "min-debug-logs",
]

keccak-cache-global = [
    "smartnet-node-core/keccak-cache-global",
    "smartnet-node-ethereum/keccak-cache-global",
    "alloy-primitives/keccak-cache-global",
]
min-error-logs = [
    "tracing/release_max_level_error",
    "smartnet-cli/min-error-logs",
    "smartnet-node-core/min-error-logs",
]
min-warn-logs = [
    "tracing/release_max_level_warn",
    "smartnet-cli/min-warn-logs",
    "smartnet-node-core/min-warn-logs",
]
min-info-logs = [
    "tracing/release_max_level_info",
    "smartnet-cli/min-info-logs",
    "smartnet-node-core/min-info-logs",
]
min-debug-logs = [
    "tracing/release_max_level_debug",
    "smartnet-cli/min-debug-logs",
    "smartnet-node-core/min-debug-logs",
]
min-trace-logs = [
    "tracing/release_max_level_trace",
    "smartnet-cli/min-trace-logs",
    "smartnet-node-core/min-trace-logs",
]

trie-debug = ["smartnet-node-builder/trie-debug", "smartnet-node-core/trie-debug"]

[[bin]]
name = "smartnet"
path = "src/main.rs"

[target.'cfg(all(unix, target_env = "gnu"))'.dependencies]
libc.workspace = true
